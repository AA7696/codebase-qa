services:
  db:
    image: pgvector/pgvector:pg17
    container_name: codebase-qa-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: codebase_qa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d codebase_qa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: